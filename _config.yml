############################
# --- Required options --- #
############################

title: Inspiring stories
description: Những câu chuyện về lòng tốt, nghị lực, lịch sử và cách con người truyền cảm hứng cho nhau.

author: tnclubmanagement

theme: beautiful-jekyll-theme

# URL thật của site sau khi deploy GitHub Pages (Settings > Pages)
url: "https://tnclubmanagement.github.io"
baseurl: "/tnclub-inspiring-story"

###############################################
# --- List of links in the navigation bar --- #
###############################################

navbar-links:
  Bài mới: "newest"
  Bài viết: "posts"
  Lưu trữ: "tags"
  Cửa hàng: "store"
  Ủng hộ: "support"

################
# --- Logo --- #
################

# Ảnh đại diện hiện ở góc trên navbar (tỉ lệ vuông đẹp nhất). Bỏ comment và
# bỏ ảnh vào assets/img/ để dùng.
# avatar: "/assets/img/avatar-icon.png"
round-avatar: true

#####################################
# --- Footer social media links --- #
#####################################

social-network-links:
  rss: true
  facebook: # điền username/trang Facebook của bạn, ví dụ: your.page.name

rss-description: Những câu chuyện truyền cảm hứng mình sưu tầm và chia sẻ lại.

###########################
# --- General options --- #
###########################

share-links-active:
  facebook: true
  twitter: false
  linkedin: false

title-on-all-pages: true
excerpt_length: 50
feed_show_excerpt: false
feed_show_tags: true
post_search: true
edit_page_button: true

######################################
# --- Colours / background image --- #
######################################

page-col: "#EEF1F6"
text-col: "#1D1D2B"
link-col: "#5AA9FF"
hover-col: "#FF7A8A"
navbar-col: "#FFFFFF"
navbar-text-col: "#1D1D2B"
navbar-border-col: "#FFFFFF"
footer-col: "#1D1D2B"
footer-text-col: "#C7C7D1"
footer-link-col: "#FFFFFF"
footer-hover-col: "#5AA9FF"

# File CSS tuỳ biến thêm (card bo góc, nền tối, chữ đậm kiểu tạp chí)
site-css:
  - "/assets/css/custom-styles.css?v=theme-store-1"

# JS tuỳ biến thêm: animation fade-in khi cuộn, hero zoom nhẹ, khối màu nền
site-js:
  - "/assets/js/custom-animations.js?v=theme-audio-1"

####################
# --- Comments --- #
####################

# Bình luận bằng Disqus: điền shortname đăng ký tại disqus.com (khung bình
# luận tự hiện dưới mỗi bài viết vì "comments: true" đã bật sẵn bên dưới).
disqus: "tnclub-inspiring-story"

################
# --- Misc --- #
################

date_format: "%d/%m/%Y"

#################################################################################
# --- You don't need to touch anything below here (but you can if you want) --- #
#################################################################################

lang: vi
timezone: "Asia/Ho_Chi_Minh"

# Đa ngôn ngữ (jekyll-polyglot): vi là ngôn ngữ gốc, en build ra /en/.
# Trang/bài không khai báo `lang:` được coi là bản vi và được nhân bản vào
# /en/ (fallback — hiện bản tiếng Việt cho tới khi có bản dịch). Khi dịch một
# trang/bài, tạo file cùng đường dẫn tương đối với front matter `lang: en`.
languages: ["vi", "en"]
default_lang: "vi"
parallel_localization: true
# File/thư mục không nhân bản sang /en (regex khớp đường dẫn tương đối).
# assets dùng đường dẫn tuyệt đối nên chỉ cần 1 bản ở root. Ảnh trong posts/
# dùng đường dẫn tương đối theo URL bài viết nên PHẢI nhân bản cùng bài.
exclude_from_localization:
  - "assets"
  - "404.html"
markdown: kramdown
highlighter: rouge
permalink: /post/:year-:month-:day-:title/

kramdown:
  input: GFM

defaults:
  - scope:
      path: "posts"
    values:
      layout: "post"
      comments: true
      social-share: true
      head-extra: ["favicon.html"]
      footer-extra: ["footer-slogan.html", "footer-links.html"]
  - scope:
      path: ""
    values:
      layout: "page"
      head-extra: ["favicon.html"]
      footer-extra: ["footer-slogan.html", "footer-links.html"]

exclude:
  - node_modules
  - package.json
  - package-lock.json
  - scripts
  - CHANGELOG.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md

include:
  - .well-known

plugins:
  - jekyll-sitemap
  - jekyll-polyglot
