- date: "02-03"
  title: "Đảng Cộng sản Việt Nam được thành lập"
  year: 1930
  description: "Sự kiện đánh dấu bước ngoặt quan trọng trong lịch sử cách mạng Việt Nam."
  source: "Tư liệu lịch sử Việt Nam"

- date: "04-30"
  title: "Ngày Giải phóng miền Nam, thống nhất đất nước"
  year: 1975
  description: "Chiến dịch Hồ Chí Minh kết thúc, đất nước bước vào thời kỳ thống nhất."
  source: "Tư liệu lịch sử Việt Nam"

- date: "05-07"
  title: "Chiến thắng Điện Biên Phủ"
  year: 1954
  description: "Chiến thắng làm nên dấu mốc lớn trong cuộc kháng chiến chống thực dân Pháp."
  source: "Tư liệu lịch sử Việt Nam"

- date: "07-27"
  title: "Ngày Thương binh - Liệt sĩ"
  year: 1947
  description: "Ngày tưởng nhớ và tri ân những người đã hy sinh, cống hiến cho đất nước."
  source: "Cổng Thông tin điện tử Chính phủ"

- date: "08-19"
  title: "Cách mạng tháng Tám thành công ở Hà Nội"
  year: 1945
  description: "Nhân dân Hà Nội giành chính quyền, mở đầu cho thắng lợi của Cách mạng tháng Tám."
  source: "Tư liệu lịch sử Việt Nam"

- date: "09-02"
  title: "Tuyên ngôn Độc lập được đọc tại Quảng trường Ba Đình"
  year: 1945
  description: "Chủ tịch Hồ Chí Minh đọc Tuyên ngôn Độc lập, khai sinh nước Việt Nam Dân chủ Cộng hòa."
  source: "Tư liệu lịch sử Việt Nam"

- date: "10-10"
  title: "Ngày Giải phóng Thủ đô"
  year: 1954
  description: "Quân ta tiến vào tiếp quản Hà Nội, mở ra một chặng đường mới của Thủ đô."
  source: "Tư liệu lịch sử Việt Nam"

- date: "12-22"
  title: "Ngày thành lập Quân đội nhân dân Việt Nam"
  year: 1944
  description: "Đội Việt Nam Tuyên truyền Giải phóng quân, tiền thân của Quân đội nhân dân Việt Nam, được thành lập."
  source: "Tư liệu lịch sử Việt Nam"
