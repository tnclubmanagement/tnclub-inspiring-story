<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Minh họa khinh khí cầu trên hành trình cảm hứng</title>
  <desc id="desc">Một minh họa vector nhiều lớp với khinh khí cầu, máy bay, núi, mây và mặt trời.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cb6bc"/>
      <stop offset="1" stop-color="#d3ece0"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffc98d"/>
      <stop offset="1" stop-color="#f18972"/>
    </linearGradient>
    <linearGradient id="balloon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f8d5a0"/>
      <stop offset=".24" stop-color="#ef7463"/>
      <stop offset=".5" stop-color="#fff0c9"/>
      <stop offset=".76" stop-color="#dc4d4c"/>
      <stop offset="1" stop-color="#f5b56f"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#246f79"/>
      <stop offset="1" stop-color="#17505e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1d4751" flood-opacity=".2"/>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#164c58" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- poster and sky -->
  <g id="background">
    <rect width="1200" height="760" rx="28" fill="#ead8c2"/>
    <rect x="36" y="34" width="1128" height="692" rx="8" fill="url(#sky)" filter="url(#shadow)"/>
    <circle cx="965" cy="157" r="88" fill="#ffe1ad" opacity=".72"/>
    <path d="M36 500C230 444 315 479 485 454c192-28 322-82 679 6v266H36Z" fill="#d6efe0"/>
  </g>

  <!-- distant clouds -->
  <g id="clouds-back" fill="#fffaf0" opacity=".88">
    <path d="M90 144c18-24 47-25 66-5 13-34 67-27 70 12 31-13 62 10 58 39H78c-9-17-3-35 12-46Z"/>
    <path d="M857 124c14-26 48-30 70-7 19-44 79-27 80 15 36-8 64 17 56 48H830c-5-20 4-42 27-56Z"/>
    <path d="M975 318c13-20 40-22 57-5 16-30 57-17 59 15 25-9 48 8 45 30H950c-3-15 5-30 25-40Z"/>
    <path d="M98 348c13-19 39-22 56-6 15-29 57-18 59 14 26-8 48 10 44 32H76c-3-15 5-30 22-40Z"/>
  </g>

  <!-- arch -->
  <g id="arch" fill="none" stroke="#fff2dc" stroke-linecap="round">
    <path d="M245 390C320 105 785 65 970 364" stroke-width="34"/>
    <path d="M245 390C320 105 785 65 970 364" stroke="#f2bf92" stroke-width="7" opacity=".45"/>
  </g>

  <!-- airplane -->
  <g id="airplane" transform="translate(98 137) rotate(-16)" fill="#f9e6c7" stroke="#c5574c" stroke-width="5" stroke-linejoin="round">
    <path d="M0 49 120 32l78-43 20 7-49 55 63 35-12 14-82-22-63 57-17-4 33-65L2 61Z"/>
    <path d="m57 40 37 26-16 8-40-22Z" fill="#5cabb2"/>
    <circle cx="133" cy="35" r="7" fill="#d85c4e" stroke="none"/>
    <path d="M33 48 2 24l-10 7 22 35Z" fill="#f1a26e"/>
  </g>

  <!-- mountains -->
  <g id="mountains-back">
    <path d="m72 541 160-206 90 124 103-180 138 245 123-196 165 213Z" fill="#3c8e94"/>
    <path d="m72 541 160-206 35 48 28 76 65-95 50 63 32 114Z" fill="#dff0df"/>
    <path d="m244 335 22 48-35-12Z M425 279l34 61-46-18Z M686 283l35 55-48-15Z" fill="#fff9e9"/>
    <path d="m107 552 145-163 81 113 112-157 122 207 115-148 173 148Z" fill="url(#mountain)"/>
    <path d="m252 389 34 64-45-17Z M445 345l42 70-56-20Z M682 398l34 52-50-15Z" fill="#cce5d7"/>
  </g>

  <!-- small balloons -->
  <g id="small-balloons" stroke="#84433f" stroke-width="3">
    <g transform="translate(177 347)">
      <path d="M0 0c0-38 62-38 62 0 0 25-31 44-31 44S0 25 0 0Z" fill="#efaa6c"/>
      <path d="M31 40v17M22 56h19" fill="none"/>
      <path d="M16 5c5-16 25-21 30-2v24c-8 7-17 7-30 0Z" fill="#e86153"/>
    </g>
    <g transform="translate(941 207) scale(.7)">
      <path d="M0 0c0-38 62-38 62 0 0 25-31 44-31 44S0 25 0 0Z" fill="#e75c54"/>
      <path d="M31 40v17M22 56h19" fill="none"/>
      <path d="M16 5c5-16 25-21 30-2v24c-8 7-17 7-30 0Z" fill="#f7d69b"/>
    </g>
    <g transform="translate(1045 410) scale(.82)">
      <path d="M0 0c0-38 62-38 62 0 0 25-31 44-31 44S0 25 0 0Z" fill="#eb745a"/>
      <path d="M31 40v17M22 56h19" fill="none"/>
      <path d="M16 5c5-16 25-21 30-2v24c-8 7-17 7-30 0Z" fill="#f7c781"/>
    </g>
  </g>

  <!-- middle landscape -->
  <g id="landscape">
    <path d="M36 554c145-61 255-32 347-3 113 36 182 4 270-22 126-37 263-22 511 36v161H36Z" fill="#f49a6e"/>
    <path d="M36 587c128-45 223-7 311 12 125 28 202-22 296-42 158-33 319 28 521 15v154H36Z" fill="#f6bf82"/>
    <path d="M710 571c35-52 62-61 74-62 15 1 35 20 55 57" fill="none" stroke="#266b71" stroke-width="8"/>
    <path d="m734 574 49-48 59 48Z" fill="#ef7359" stroke="#7c4e48" stroke-width="4"/>
    <path d="M759 573v-37h45v37" fill="#f8d89d" stroke="#7c4e48" stroke-width="4"/>
    <path d="M689 613c46-29 92-28 137 0" fill="none" stroke="#286d72" stroke-width="8"/>
    <path d="M673 581c10-33 14-49 14-61M689 566c-16-22-25-28-35-30M689 561c19-22 27-28 38-31" fill="none" stroke="#337d73" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- main balloon -->
  <g id="main-balloon" transform="translate(428 116)" filter="url(#soft-shadow)">
    <path d="M0 151C0 47 85 0 177 0s177 47 177 151c0 106-86 185-177 185S0 257 0 151Z" fill="url(#balloon)" stroke="#b8544b" stroke-width="5"/>
    <path d="M54 42c-24 37-35 74-35 111 0 72 42 135 78 161" fill="none" stroke="#d9574e" stroke-width="20" opacity=".82"/>
    <path d="M119 11c-24 47-29 93-27 144 3 68 24 120 44 151" fill="none" stroke="#fff0c9" stroke-width="24" opacity=".82"/>
    <path d="M183 4c-12 68-11 147 0 298" fill="none" stroke="#d9564f" stroke-width="22" opacity=".84"/>
    <path d="M251 13c25 63 27 136 11 204-9 38-25 68-40 84" fill="none" stroke="#fff0c9" stroke-width="23" opacity=".8"/>
    <path d="M310 50c27 43 36 83 36 111 0 72-33 124-70 161" fill="none" stroke="#d9544d" stroke-width="18" opacity=".78"/>
    <path d="M137 328h80l-17 32h-48Z" fill="#5b5149" stroke="#3e4543" stroke-width="5"/>
    <path d="M145 331 126 371M208 331l19 40" stroke="#755448" stroke-width="5"/>
    <rect x="151" y="354" width="51" height="37" rx="3" fill="#8e5b46" stroke="#4f4944" stroke-width="5"/>
    <path d="M157 361h39v22h-39Z" fill="#d88b60"/>
  </g>

  <!-- foreground clouds -->
  <g id="clouds-front" fill="url(#sunset)" stroke="#e67c68" stroke-width="3">
    <path d="M36 658c34-45 78-40 103-13 25-72 129-74 159-6 52-26 115 10 107 62H36Z"/>
    <path d="M365 701c31-56 92-59 126-16 27-67 124-62 148 5 54-35 130 3 126 70H365Z"/>
    <path d="M798 685c27-51 82-57 119-19 18-64 113-68 142-4 38-27 97 1 105 55H798Z"/>
  </g>

  <!-- tiny decorative details -->
  <g id="details" fill="none" stroke="#fff8e7" stroke-linecap="round" opacity=".85">
    <path d="M335 489q12-11 24 0M367 481q10-9 21 0M1010 530q10-9 19 0M1037 523q9-8 18 0" stroke-width="4"/>
    <path d="M115 649h48M179 649h32M1030 674h45M1090 674h23" stroke-width="2"/>
  </g>
</svg>
